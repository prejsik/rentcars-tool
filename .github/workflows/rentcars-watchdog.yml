name: RentCars daily watchdog

on:
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"
    - cron: "30 7 * * *"
  workflow_run:
    workflows: ["RentCars daily run"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: rentcars-watchdog-recovery
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    name: Check the RentCars daily run
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check Warsaw watchdog gate
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_STATUS: ${{ github.event.workflow_run.status }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            trusted_event=false
            if [[ "$SOURCE_EVENT" == "schedule" ]]; then
              trusted_event=true
            elif [[ "$SOURCE_EVENT" == "workflow_dispatch" && "$SOURCE_TITLE" == "RentCars watchdog recovery" ]]; then
              trusted_event=true
            fi

            if [[ "$SOURCE_REPOSITORY" == "$GITHUB_REPOSITORY" \
              && "$SOURCE_BRANCH" == "$DEFAULT_BRANCH" \
              && "$SOURCE_STATUS" == "completed" \
              && ( "$SOURCE_CONCLUSION" == "failure" || "$SOURCE_CONCLUSION" == "timed_out" ) \
              && "$trusted_event" == "true" ]]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          trigger_schedule="${{ github.event.schedule }}"
          scheduled_minute="${trigger_schedule%% *}"
          schedule_tail="${trigger_schedule#* }"
          scheduled_hour="${schedule_tail%% *}"
          utc_date="$(date -u +%Y-%m-%d)"
          intended_warsaw_hour="$(TZ=Europe/Warsaw date -d "$utc_date $scheduled_hour:$scheduled_minute UTC" +%H)"
          intended_warsaw_minute="$(TZ=Europe/Warsaw date -d "$utc_date $scheduled_hour:$scheduled_minute UTC" +%M)"

          if [[ "$intended_warsaw_minute" == "30" && ( "$intended_warsaw_hour" == "06" || "$intended_warsaw_hour" == "08" ) ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Inspect recent RentCars daily runs
        if: steps.gate.outputs.should_run == 'true'
        id: decision
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WATCHDOG_MODE: ${{ github.event_name }}
          WATCHDOG_REPOSITORY: ${{ github.repository }}
          WATCHDOG_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WATCHDOG_TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          WATCHDOG_TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          WATCHDOG_TRIGGER_STATUS: ${{ github.event.workflow_run.status }}
          WATCHDOG_TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WATCHDOG_TRIGGER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WATCHDOG_TRIGGER_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          WATCHDOG_TRIGGER_TITLE: ${{ github.event.workflow_run.display_title }}
          WATCHDOG_TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WATCHDOG_TRIGGER_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          inspection_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          since="$(date -u -d '2 days ago' +%Y-%m-%d)"
          runs_url="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/actions/workflows/rentcars-daily.yml/runs?branch=${DEFAULT_BRANCH}&created=%3E%3D${since}&per_page=100&inspection=${inspection_key}"
          if ! runs_json=$(curl --fail --silent --show-error \
            --max-time 30 \
            --header "Cache-Control: no-cache" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$runs_url"); then
            runs_json='{}'
          fi
          if ! decision_json=$(printf '%s' "$runs_json" | WATCHDOG_SINCE="$since" node src/rentcars/watchdog.js); then
            decision_json='{"action":"inspection_failed","runId":null,"runAttempt":0}'
          fi
          DECISION_JSON="$decision_json" node -e '
            const decision = JSON.parse(process.env.DECISION_JSON);
            process.stdout.write(`action=${decision.action}\nrun_id=${decision.runId || ""}\nrun_attempt=${decision.runAttempt || 0}\n`);
          ' >> "$GITHUB_OUTPUT"
          echo "Watchdog decision: $decision_json"

      - name: Recover or report RentCars daily status
        if: always() && steps.gate.outputs.should_run == 'true' && steps.decision.outputs.action != 'none'
        shell: bash
        env:
          ACTION: ${{ steps.decision.outputs.action }}
          TARGET_RUN_ID: ${{ steps.decision.outputs.run_id }}
          TARGET_RUN_ATTEMPT: ${{ steps.decision.outputs.run_attempt }}
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          api_failed=false
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}"
          if [[ -z "$TARGET_RUN_ID" ]]; then
            target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/rentcars-daily.yml"
          fi

          case "$ACTION" in
            rerun)
              if ! current_run=$(curl --fail --silent --show-error --max-time 15 \
                --header "Cache-Control: no-cache" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                "${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}?inspection=${GITHUB_RUN_ID}-$(date +%s)"); then
                api_failed=true
                message="RentCars.pl watchdog: could not verify the current state of run ${TARGET_RUN_ID}; no retry was started."
              elif ! CURRENT_RUN_JSON="$current_run" node -e '
                const { isTrustedDailyRun } = require("./src/rentcars/watchdog");
                const run = JSON.parse(process.env.CURRENT_RUN_JSON);
                const valid = String(run.id) === process.env.TARGET_RUN_ID
                  && run.run_attempt === Number(process.env.TARGET_RUN_ATTEMPT)
                  && run.run_attempt < 3 && run.status === "completed"
                  && ["failure", "timed_out"].includes(run.conclusion)
                  && isTrustedDailyRun(run, { repository: process.env.GITHUB_REPOSITORY,
                    defaultBranch: process.env.DEFAULT_BRANCH });
                process.exit(valid ? 0 : 1);
              '; then
                message="RentCars.pl watchdog: run ${TARGET_RUN_ID} changed state or attempt; no retry was started."
              elif curl --fail --silent --show-error \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/rerun"; then
                message="RentCars.pl watchdog: retrying the complete run ${TARGET_RUN_ID} after attempt ${TARGET_RUN_ATTEMPT}, so every chunk artifact is rebuilt."
              else
                api_failed=true
                message="RentCars.pl watchdog: could not retry run ${TARGET_RUN_ID}."
              fi
              ;;
            missing)
              message="RentCars.pl watchdog: no primary morning run could be verified for today. This may be missing or stale GitHub API data. No replacement was started; manual inspection is required."
              api_failed=true
              ;;
            monitor)
              message="RentCars.pl watchdog: the daily run is still active at this checkpoint."
              ;;
            inspection_failed)
              message="RentCars.pl watchdog: GitHub did not provide enough current run/job data to verify the daily report. No duplicate run was started; manual inspection is required."
              api_failed=true
              ;;
            reporting_failed)
              message="RentCars.pl watchdog: collection and merge completed for run ${TARGET_RUN_ID}, but publishing or notification failed. No collection rerun was started; inspect the failed reporting job."
              api_failed=true
              ;;
            exhausted)
              message="RentCars.pl watchdog: run ${TARGET_RUN_ID} is still failing after three attempts; automatic retries are exhausted."
              ;;
            *)
              message="RentCars.pl watchdog: unexpected decision ${ACTION}."
              api_failed=true
              ;;
          esac

          printf -v telegram_message '%s\n\nGitHub Actions:\n%s' "$message" "$target_url"
          if [[ -n "$TELEGRAM_BOT_TOKEN" && -n "$TELEGRAM_CHAT_ID" ]]; then
            curl --fail --show-error --silent \
              --retry 3 \
              --retry-delay 3 \
              --retry-all-errors \
              --request POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${telegram_message}" \
              --data-urlencode "disable_web_page_preview=true"
          else
            echo "::warning::Telegram secrets are missing; watchdog action completed without a message."
          fi

          if [[ "$api_failed" == "true" ]]; then
            exit 1
          fi
